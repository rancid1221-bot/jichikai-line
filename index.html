// ----- タブ切り替え -----
function switchTab(tabName, btnEl) {
  document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tabName).classList.add('active');
  btnEl.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

//  お問い合わせ
// ===========================
function renderContacts() {
  const list = document.getElementById('contact-list');
  list.innerHTML = CONTACTS.map(c => {
    const phoneBtn = c.phone
      ? `<a class="btn btn-phone" href="tel:${c.phone.replace(/-/g,'')}" role="button">📞 電話する</a>`
      : `<span class="btn btn-disabled">📞 電話なし</span>`;

    const lineBtn = c.lineId
      ? `<a class="btn btn-line" href="line://ti/p/${c.lineId}" role="button">💬 LINEで連絡</a>`
      : `<span class="btn btn-disabled">💬 LINE未設定</span>`;

    return `
      <div class="contact-card">
        <div class="contact-role-row">
          <span class="role-icon">${c.icon}</span>
          <div>
            <div class="role-title">${c.role}</div>
            <div class="role-name">${c.name}</div>
          </div>
        </div>
        ${c.note ? `<div class="contact-note">${c.note}</div>` : ''}
        <div class="contact-buttons">
          ${phoneBtn}
          ${lineBtn}
        </div>
      </div>`;
  }).join('');
}

// ===========================
//  回覧板・お知らせ
// ===========================
let selectedYear  = null;
let selectedMonth = null;

function getYears() {
  return [...new Set(NOTICES.map(n => n.year))].sort((a,b) => b - a);
}

function getDefaultMonth(year) {
  const months = [...new Set(
    NOTICES.filter(n => n.year === year).map(n => n.month)
  )].sort((a, b) => b - a);
  return months.length > 0 ? months[0] : new Date().getMonth() + 1;
}

function renderYearFilterChips() {
  const years = getYears();
  selectedYear = years[0];
  const el = document.getElementById('year-filter-chips');
  el.innerHTML = years.map((y, i) =>
    `<button class="chip ${i === 0 ? 'active' : ''}" onclick="filterYear(${y}, this)">${y}年</button>`
  ).join('');
}

function renderMonthFilterChips() {
  selectedMonth = getDefaultMonth(selectedYear);
  const el = document.getElementById('month-filter-chips');
  el.innerHTML = [...Array(12)].map((_, i) => {
    const m = i + 1;
    return `<button class="chip ${m === selectedMonth ? 'active' : ''}" onclick="filterMonth(${m}, this)">${m}月</button>`;
  }).join('');
}

function filterYear(year, el) {
  selectedYear = year;
  document.querySelectorAll('#year-filter-chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedMonth = getDefaultMonth(year);
  document.querySelectorAll('#month-filter-chips .chip').forEach((btn, i) => {
    btn.classList.toggle('active', (i + 1) === selectedMonth);
  });
  renderNoticeList();
}

function filterMonth(month, el) {
  selectedMonth = month;
  document.querySelectorAll('#month-filter-chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderNoticeList();
}

function renderNoticeList() {
  const filtered = NOTICES
    .filter(n => {
      if (selectedYear  !== null && n.year  !== selectedYear)  return false;
      if (selectedMonth !== null && n.month !== selectedMonth) return false;
      return true;
    })
    .sort((a, b) => {
      if (a.year  !== b.year)  return b.year  - a.year;
      if (a.month !== b.month) return b.month - a.month;
      return b.day - a.day;
    });

  const countEl = document.getElementById('notice-count-label');
  countEl.textContent = `${filtered.length} 件`;

  const container = document.getElementById('notice-list');
  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="no-data">
        <span class="no-data-icon">📭</span>
        この期間のお知らせはありません
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(n => {
    const dateStr = `${n.year}年${n.month}月${n.day}日`;
    return `
      <div class="notice-item">
        <div class="notice-meta">
          <span class="badge badge-${n.category}">${n.category}</span>
          <span class="notice-date">${dateStr}</span>
        </div>
        <div class="notice-title">${n.title}</div>
        <div class="notice-detail">${n.detail.replace(/\n/g,'<br>')}</div>
      </div>`;
  }).join('');
}

//  組織図
// ===========================
let selectedOrgYear = null;

function renderOrgYearSelector() {
  const years = Object.keys(ORG_CHART).map(Number).sort((a,b) => b - a);
  selectedOrgYear = years[0];
  const el = document.getElementById('org-year-selector');
  el.innerHTML = years.map((y, i) =>
    `<button class="year-btn ${i === 0 ? 'active' : ''}" onclick="selectOrgYear(${y}, this)">${y}年度</button>`
  ).join('');
}

function selectOrgYear(year, el) {
  selectedOrgYear = year;
  document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderOrgChart();
}

function renderOrgChart() {
  const data = ORG_CHART[selectedOrgYear];
  if (!data) {
    document.getElementById('org-chart').innerHTML =
      '<div class="no-data"><span class="no-data-icon">📋</span>この年度のデータはありません</div>';
    return;
  }

  let html = '';

  // 役員
  html += `<div class="org-group"><div class="org-group-title">🏅 役員</div>`;
  html += data.leaders.map(l => `
    <div class="org-member-card">
      <span class="org-icon">${l.icon}</span>
      <div>
        <div class="org-name">${l.name}</div>
        <div class="org-role">${l.title}</div>
        <div class="org-term">${l.term}</div>
      </div>
    </div>`).join('');
  html += '</div>';

  // 各部
  (data.departments || []).forEach(dept => {
    html += `<div class="org-group"><div class="org-group-title">🔹 ${dept.name}</div>`;
    html += dept.members.map(m => `
      <div class="org-member-card">
        <span class="org-icon">${m.icon}</span>
        <div>
          <div class="org-name">${m.name}</div>
          <div class="org-role">${m.role}</div>
          ${m.term ? `<div class="org-term">${m.term}</div>` : ''}
        </div>
      </div>`).join('');
    html += '</div>';
  });

  document.getElementById('org-chart').innerHTML = html;
}

// ===========================
//  資料ボタン & モーダル
// ===========================
function renderDocumentButtons() {
  const row = document.getElementById('doc-btn-row');
  if (!row) return;
  row.innerHTML = DOCUMENTS.map((d, i) => `
    <button class="doc-btn" onclick="openDocModal(${i})">
      <span class="doc-btn-icon">${d.icon}</span>${d.title}
    </button>`).join('');
}

function openDocModal(index) {
  const d = DOCUMENTS[index];
  document.getElementById('doc-modal-title').textContent = d.title;
  const body = document.getElementById('doc-modal-body');
  if (!d.url) {
    body.innerHTML = `
      <div class="doc-modal-placeholder">
        <span class="doc-modal-placeholder-icon">📂</span>
        まだファイルが設定されていません<br>
        <small>index.html の DOCUMENTS に<br>ファイルのパスを設定してください</small>
      </div>`;
  } else if (d.type === 'pdf') {
    body.innerHTML = `<iframe src="${d.url}"></iframe>`;
  } else {
    body.innerHTML = `<img src="${d.url}" alt="${d.title}">`;
  }
  document.getElementById('doc-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDocModal() {
  document.getElementById('doc-modal').classList.remove('open');
  document.body.style.overflow = '';
}

// ===========================
//  LIFF 初期化 & 起動
// ===========================
async function initApp() {
  // LIFF IDが設定されている場合のみ初期化
  if (LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID_HERE") {
    try {
      await liff.init({ liffId: LIFF_ID });
      console.log("LIFF initialized:", liff.getOS());
    } catch (e) {
      console.warn("LIFF初期化エラー（ブラウザ確認中は無視可）:", e.message);
    }
  }

  // URLパラメータ ?tab=notices や ?tab=org でタブを指定可能
  // 例：リッチメニューの「回覧板」ボタンのURLに ?tab=notices を付ける
  const params = new URLSearchParams(location.search);
  const tabParam = params.get('tab');
  if (tabParam) {
    const targetBtn = document.querySelector(`.nav-btn[onclick*="'${tabParam}'"]`);
    if (targetBtn) switchTab(tabParam, targetBtn);
  }

  // 各セクション描画
  renderContacts();
  renderDocumentButtons();
  renderYearFilterChips();
  renderMonthFilterChips();
  renderNoticeList();
  renderOrgYearSelector();
  renderOrgChart();
}

// アプリ起動
initApp();
