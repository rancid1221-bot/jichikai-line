<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

    /* ========== リセット & ベース ========== */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', 'Yu Gothic', sans-serif;

      min-height: 100vh;

    a { text-decoration: none; color: inherit; }

    /* ========== ヘッダー ========== */
    .app-header {
      background: linear-gradient(135deg, #00B900 0%, #00A000 100%);
      color: white;
      padding: 14px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 200;
      box-shadow: 0 2px 10px rgba(0,185,0,0.3);
    }
    .app-header h1 { font-size: 19px; font-weight: bold; letter-spacing: 0.5px; }

    /* ========== ボトムナビゲーション ========== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      display: flex;
      border-top: 1px solid #e0e0e0;
      z-index: 200;
      padding-bottom: env(safe-area-inset-bottom, 0);
      box-shadow: 0 -2px 12px rgba(0,0,0,0.08);
    }
    .nav-btn {
      flex: 1;
      padding: 10px 4px 8px;
      text-align: center;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 11px;
      color: #999;
      transition: all 0.2s;
      line-height: 1.3;
    }
    .nav-btn.active { color: #00B900; }
    .nav-btn .nav-icon { font-size: 24px; display: block; margin-bottom: 3px; }

    /* ========== メインコンテンツ ========== */
    .main-content {
      padding: 18px 14px;
      padding-bottom: 90px;
      max-width: 600px;
      margin: 0 auto;
    }

    .section-title { font-size: 20px; font-weight: bold; color: #222; margin-bottom: 4px; }
    .section-subtitle { font-size: 14px; color: #777; line-height: 1.5; }

    /* ========== お問い合わせ カード ========== */
    .contact-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      border-left: 5px solid #00B900;

    .contact-role-row {

      align-items: center;
      gap: 12px;
      margin-bottom: 10px;

    .role-title { font-size: 17px; font-weight: bold; color: #222; }
    .role-name { font-size: 15px; color: #555; margin-top: 2px; }
    .contact-note {
      font-size: 13px;
      color: #888;
      background: #f8f8f8;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .contact-buttons { display: flex; gap: 10px; }
    .btn {
      flex: 1;
      padding: 14px 8px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      transition: transform 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      line-height: 1;
    }
    .btn:active { transform: scale(0.95); opacity: 0.8; }
    .btn-phone {
      background: #EAF4FF;
      color: #0066CC;
      border: 2px solid #B8D8F5;
    }
    .btn-line {
      background: #00B900;
      color: white;
    }
    .btn-disabled {
      background: #f0f0f0;
      color: #bbb;
      cursor: default;
      border: 2px solid #e0e0e0;
    }

    /* ========== フィルターチップ ========== */
    .filter-block { margin-bottom: 14px; }
    .filter-label {
      font-size: 13px;
      font-weight: bold;
      color: #555;
      margin-bottom: 8px;
    }
    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      padding: 8px 16px;
      border-radius: 20px;
      border: 2px solid #ddd;
      background: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.18s;
      white-space: nowrap;
      font-weight: bold;
    }
    .chip.active {
      background: #00B900;
      color: white;
      border-color: #00B900;
    }

    /* ========== お知らせ一覧 ========== */
    .notice-count {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }
    .notice-item {
      background: white;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      cursor: pointer;
      transition: transform 0.15s;
    }
    .notice-item:active { transform: scale(0.98); }
    .notice-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
    }
    .badge-行事 { background: #FFF3E0; color: #E65100; }
    .badge-回覧板 { background: #E8F5E9; color: #2E7D32; }
    .badge-お知らせ { background: #E3F2FD; color: #1565C0; }
    .notice-date { font-size: 13px; color: #999; }
    .notice-title {
      font-size: 16px;
      font-weight: bold;
      color: #222;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .notice-detail {
      font-size: 14px;
      color: #555;
      line-height: 1.7;
      white-space: pre-line;
    }
    .no-data {
      text-align: center;
      padding: 50px 20px;
      color: #aaa;
      font-size: 15px;
      line-height: 2;
    }
    .no-data-icon { font-size: 40px; display: block; margin-bottom: 10px; }

    /* ========== 組織図 ========== */
    .year-selector-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 20px;
      scrollbar-width: none;
    }
    .year-selector-row::-webkit-scrollbar { display: none; }
    .year-btn {
      padding: 10px 22px;
      border-radius: 22px;
      border: 2px solid #ddd;
      background: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.18s;
    }
    .year-btn.active {
      background: #00B900;
      color: white;
      border-color: #00B900;
    }
    .org-group { margin-bottom: 20px; }
    .org-group-title {
      font-size: 14px;
      font-weight: bold;
      color: #00A000;
      background: #E8F5E9;
      padding: 8px 14px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    .org-member-card {
      background: white;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);

      align-items: center;
      gap: 14px;

    .tab-section { display: none; animation: fadeIn 0.2s ease; }

    .page-top-btn {
      display: block;
      text-align: center;
      padding: 14px;
      font-size: 14px;
      color: #00B900;
      font-weight: bold;
      margin-top: 10px;
    }

    /* ========== 資料ボタン ========== */
    .doc-section { margin-bottom: 18px; }
    .doc-btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .doc-btn {

      align-items: center;
      gap: 8px;
      padding: 12px 18px;
      background: white;
      border: 2px solid #ddd;
      border-radius: 14px;
      font-size: 15px;
      font-weight: bold;
      color: #333;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: all 0.18s;
      white-space: nowrap;
    }
    .doc-btn:active { transform: scale(0.95); }
    .doc-btn-icon { font-size: 22px; }

    .doc-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 500;
      align-items: center;
      justify-content: center;
      padding: 16px;

    .doc-modal.open { display: flex; }
    .doc-modal-box {
      background: white;
      border-radius: 18px;
      width: 100%;
      max-width: 560px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);

    .doc-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }
    .doc-modal-title-text { font-size: 17px; font-weight: bold; color: #222; }
    .doc-modal-close {
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .doc-modal-body {
      flex: 1;
      overflow: auto;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 120px;
    }
    .doc-modal-body img { max-width: 100%; height: auto; border-radius: 8px; }

    .doc-modal-placeholder-icon { font-size: 48px; display: block; margin-bottom: 10px; }

    /* ========== 合言葉ゲート ========== */
    .password-gate {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, #00B900 0%, #00A000 100%);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .password-card {
      background: white;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 340px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);

    .password-icon { font-size: 44px; margin-bottom: 10px; line-height: 1; }
    .password-title { font-size: 19px; font-weight: bold; color: #222; margin-bottom: 6px; }
    .password-desc { font-size: 13px; color: #777; margin-bottom: 20px; line-height: 1.5; }
    .password-input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid #ddd;
      font-size: 16px;
      margin-bottom: 8px;
      text-align: center;
      outline: none;
      font-family: inherit;
    }
    .password-input:focus { border-color: #00B900; }
    .password-error {
      font-size: 13px;
      color: #E53935;
      min-height: 18px;
      margin-bottom: 10px;
      line-height: 1.5;
    }
    .password-submit { width: 100%; }

    .sub-section-title {
      font-size: 17px;
      font-weight: bold;
      color: #222;
      margin: 26px 0 4px;
    }
    .sub-section-subtitle {
      font-size: 13px;
      color: #777;
      margin-bottom: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<!-- ========== 合言葉ゲート ========== -->

    <div class="notice-count" id="drive-count-label"></div>
    <div id="drive-file-list"><!-- JSで生成 --></div>

    <a class="page-top-btn" href="#page-top" onclick="document.getElementById('page-top').scrollIntoView({behavior:'smooth'});return false;">▲ トップへ戻る</a>
  </section>

  <!-- ========== 組織図 タブ ========== -->
  <section id="tab-org" class="tab-section">

      <div class="section-title">👥 自治会組織図</div>

    <a class="page-top-btn" href="#page-top" onclick="document.getElementById('page-top').scrollIntoView({behavior:'smooth'});return false;">▲ トップへ戻る</a>
  </section>

</main>

<!-- ボトムナビゲーション -->

  </button>
  <button class="nav-btn" onclick="switchTab('org', this)">

    組織図
  </button>
</nav>


<!-- ドキュメントモーダル -->
<div id="doc-modal" class="doc-modal" onclick="closeDocModal()">
  <div class="doc-modal-box" onclick="event.stopPropagation()">
    <div class="doc-modal-header">
      <span id="doc-modal-title" class="doc-modal-title-text"></span>
      <button class="doc-modal-close" onclick="closeDocModal()">✕</button>
    </div>
    <div class="doc-modal-body" id="doc-modal-body"></div>
  </div>
</div>

// ----- HTMLエスケープ（外部データ表示時のXSS対策） -----
function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

// ----- タブ切り替え -----
function switchTab(tabName, btnEl) {
  document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tabName).classList.add('active');
  btnEl.classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===========================
//  行事予定（Googleカレンダー連携）
// ===========================
let calendarEvents = [];       // 取得済みイベント一覧
let calendarLoadState = 'loading'; // 'loading' | 'ok' | 'error'
let selectedYear  = null;
let selectedMonth = null;

async function fetchCalendarEvents() {
  const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(CALENDAR_ID)}/events`
    + `?key=${API_KEY}&singleEvents=true&orderBy=startTime&maxResults=2500`
    + `&timeMin=2023-01-01T00:00:00Z&timeMax=2031-12-31T23:59:59Z`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('calendar fetch failed: ' + res.status);
  const data = await res.json();
  return (data.items || []).map(ev => {
    const startStr = (ev.start && (ev.start.dateTime || ev.start.date)) || null;
    const d = startStr ? new Date(startStr) : null;
    if (!d || isNaN(d.getTime())) return null;
    return {
      id: ev.id,
      title: ev.summary || '(無題の予定)',
      location: ev.location || '',
      year: d.getFullYear(),
      month: d.getMonth() + 1,
      day: d.getDate(),
      dateObj: d
    };
  }).filter(Boolean);
}

function getEventYears() {
  return [...new Set(calendarEvents.map(e => e.year))].sort((a, b) => b - a);
}

function getDefaultMonth(year) {
  const months = [...new Set(
    calendarEvents.filter(e => e.year === year).map(e => e.month)
  )].sort((a, b) => b - a);
  return months.length > 0 ? months[0] : new Date().getMonth() + 1;
}

function renderYearFilterChips() {
  const years = getEventYears();
  const el = document.getElementById('year-filter-chips');
  if (years.length === 0) {
    selectedYear = null;
    el.innerHTML = '';
    return;
  }
  selectedYear = years[0];
  el.innerHTML = years.map((y, i) =>
    `<button class="chip ${i === 0 ? 'active' : ''}" onclick="filterYear(${y}, this)">${y}年</button>`
  ).join('');
}

function renderMonthFilterChips() {
  selectedMonth = getDefaultMonth(selectedYear);
  const el = document.getElementById('month-filter-chips');
  el.innerHTML = [...Array(12)].map((_, i) => {
    const m = i + 1;
    return `<button class="chip ${m === selectedMonth ? 'active' : ''}" onclick="filterMonth(${m}, this)">${m}月</button>`;
  }).join('');
}

function filterYear(year, el) {
  selectedYear = year;
  document.querySelectorAll('#year-filter-chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  selectedMonth = getDefaultMonth(year);
  document.querySelectorAll('#month-filter-chips .chip').forEach((btn, i) => {
    btn.classList.toggle('active', (i + 1) === selectedMonth);
  });
  renderNoticeList();
}

function filterMonth(month, el) {
  selectedMonth = month;
  document.querySelectorAll('#month-filter-chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderNoticeList();
}

function renderNoticeList() {
  const countEl = document.getElementById('notice-count-label');
  const container = document.getElementById('notice-list');

  if (calendarLoadState === 'loading') {
    countEl.textContent = '';
    container.innerHTML = `<div class="no-data"><span class="no-data-icon">⏳</span>読み込み中...</div>`;
    return;
  }
  if (calendarLoadState === 'error') {
    countEl.textContent = '';
    container.innerHTML = `
      <div class="no-data">
        <span class="no-data-icon">⚠️</span>
        行事予定の読み込みに失敗しました<br>
        <small>電波状況を確認して、後ほどお試しください</small>
      </div>`;
    return;
  }

  const filtered = calendarEvents
    .filter(e => {
      if (selectedYear  !== null && e.year  !== selectedYear)  return false;
      if (selectedMonth !== null && e.month !== selectedMonth) return false;
      return true;
    })
    .sort((a, b) => b.dateObj - a.dateObj);

  countEl.textContent = `${filtered.length} 件`;

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="no-data">
        <span class="no-data-icon">📭</span>
        この期間の行事予定はありません
      </div>`;
    return;
  }

  container.innerHTML = filtered.map(e => {
    const dateStr = `${e.year}年${e.month}月${e.day}日`;
    return `
      <div class="notice-item">
        <div class="notice-meta">
          <span class="badge badge-行事">行事</span>
          <span class="notice-date">${dateStr}</span>
        </div>
        <div class="notice-title">${escapeHtml(e.title)}</div>
        ${e.location ? `<div class="notice-detail">場所：${escapeHtml(e.location)}</div>` : ''}
      </div>`;
  }).join('');
}

// ===========================
//  回覧板・お知らせ資料（Google Drive連携）
// ===========================
let driveFiles = [];
let driveLoadState = 'loading'; // 'loading' | 'ok' | 'error'

async function fetchDriveFiles() {
  const q = `'${DRIVE_FOLDER_ID}' in parents and trashed=false`;
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`
    + `&key=${API_KEY}&fields=files(id,name,mimeType,createdTime)&orderBy=createdTime desc&pageSize=200`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('drive fetch failed: ' + res.status);
  const data = await res.json();
  return data.files || [];
}

function formatDateJp(isoStr) {
  const d = new Date(isoStr);
  if (isNaN(d.getTime())) return '';
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}

function driveFileToDocSpec(f) {
  if (f.mimeType === 'application/pdf') {
    return { type: 'pdf', url: `https://drive.google.com/file/d/${f.id}/preview` };
  }
  if (f.mimeType && f.mimeType.indexOf('image/') === 0) {
    return { type: 'image', url: `https://drive.google.com/thumbnail?id=${f.id}&sz=w1600` };
  }
  return { type: 'unsupported', url: '' };
}

function renderDriveFileList() {
  const countEl = document.getElementById('drive-count-label');
  const container = document.getElementById('drive-file-list');

  if (driveLoadState === 'loading') {
    countEl.textContent = '';
    container.innerHTML = `<div class="no-data"><span class="no-data-icon">⏳</span>読み込み中...</div>`;
    return;
  }
  if (driveLoadState === 'error') {
    countEl.textContent = '';
    container.innerHTML = `
      <div class="no-data">
        <span class="no-data-icon">⚠️</span>
        資料の読み込みに失敗しました<br>
        <small>電波状況を確認して、後ほどお試しください</small>
      </div>`;
    return;
  }
  if (driveFiles.length === 0) {
    countEl.textContent = '';
    container.innerHTML = `
      <div class="no-data">
        <span class="no-data-icon">📭</span>
        資料はまだアップロードされていません
      </div>`;
    return;
  }

  countEl.textContent = `${driveFiles.length} 件`;
  container.innerHTML = driveFiles.map((f, i) => {
    let icon = '📁';
    if (f.mimeType === 'application/pdf') icon = '📄';
    else if (f.mimeType && f.mimeType.indexOf('image/') === 0) icon = '🖼️';
    const dateStr = f.createdTime ? formatDateJp(f.createdTime) : '';
    return `
      <div class="drive-file-card" onclick="openDriveFileModal(${i})">
        <span class="drive-file-icon">${icon}</span>
        <div>
          <div class="drive-file-name">${escapeHtml(f.name)}</div>
          ${dateStr ? `<div class="drive-file-date">${dateStr}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function openDriveFileModal(index) {
  const f = driveFiles[index];
  if (!f) return;
  showDocModal(f.name, driveFileToDocSpec(f));
}

// DOCUMENTS（ゴミ当番／公民館清掃）のURLを、取得済みのDriveファイル一覧から解決する
function resolveDocumentUrls() {
  DOCUMENTS.forEach(doc => {
    if (!doc.driveFileName) return;
    const match = driveFiles.find(f => f.name === doc.driveFileName);
    if (match) {
      const spec = driveFileToDocSpec(match);
      doc.url = spec.url;
      doc.type = spec.type === 'unsupported' ? doc.type : spec.type;
    } else {
      doc.url = '';
    }
  });
}

// ===========================
//  組織図（Googleスプレッドシート連携）
// ===========================
let orgChartData = {};          // { 年度: { leaders: [...], departments: [{name, members}] } }
let orgLoadState = 'loading';   // 'loading' | 'ok' | 'error'
let selectedOrgYear = null;

async function fetchOrgSheet() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(SHEET_RANGE)}?key=${API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('sheets fetch failed: ' + res.status);
  const data = await res.json();
  return data.values || [];
}

// スプレッドシートの行データ（[年度,グループ,名前,役職,任期,アイコン]）を
// 年度→役員/グループ別のオブジェクトに変換する
function buildOrgChartFromRows(rows) {
  const chart = {};
  rows.forEach(row => {
    const yearRaw = row[0];
    const group   = (row[1] || '').trim();
    const name    = (row[2] || '').trim();
    const role    = (row[3] || '').trim();
    const term    = (row[4] || '').trim();
    const icon    = (row[5] || '').trim() || '👤';
    if (!yearRaw || !name) return; // 年度・名前が無い行はスキップ
    const year = Number(yearRaw);
    if (!Number.isFinite(year)) return;

    if (!chart[year]) chart[year] = { leaders: [], departments: [] };

    if (group === '役員') {
      chart[year].leaders.push({ name, title: role, term, icon });
    } else {
      let dept = chart[year].departments.find(d => d.name === group);
      if (!dept) {
        dept = { name: group || 'その他', members: [] };
        chart[year].departments.push(dept);
      }
      dept.members.push({ name, role, term, icon });
    }
  });
  return chart;
}

function renderOrgYearSelector() {
  const el = document.getElementById('org-year-selector');
  if (orgLoadState !== 'ok') {
    el.innerHTML = '';
    return;
  }
  const years = Object.keys(orgChartData).map(Number).sort((a, b) => b - a);
  if (years.length === 0) {
    selectedOrgYear = null;
    el.innerHTML = '';
    return;
  }
  selectedOrgYear = years[0];
  el.innerHTML = years.map((y, i) =>
    `<button class="year-btn ${i === 0 ? 'active' : ''}" onclick="selectOrgYear(${y}, this)">${y}年度</button>`
  ).join('');
}

function selectOrgYear(year, el) {
  selectedOrgYear = year;
  document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderOrgChart();
}

function renderOrgChart() {
  const container = document.getElementById('org-chart');

  if (orgLoadState === 'loading') {
    container.innerHTML = `<div class="no-data"><span class="no-data-icon">⏳</span>読み込み中...</div>`;
    return;
  }
  if (orgLoadState === 'error') {
    container.innerHTML = `
      <div class="no-data">
        <span class="no-data-icon">⚠️</span>
        組織図の読み込みに失敗しました<br>
        <small>電波状況を確認して、後ほどお試しください</small>
      </div>`;
    return;
  }

  const data = orgChartData[selectedOrgYear];
  if (!data) {
    container.innerHTML = '<div class="no-data"><span class="no-data-icon">📋</span>この年度のデータはありません</div>';
    return;
  }

  let html = '';

  // 役員
  if (data.leaders.length > 0) {
    html += `<div class="org-group"><div class="org-group-title">🏅 役員</div>`;
    html += data.leaders.map(l => `
      <div class="org-member-card">
        <span class="org-icon">${escapeHtml(l.icon)}</span>
        <div>
          <div class="org-name">${escapeHtml(l.name)}</div>
          <div class="org-role">${escapeHtml(l.title)}</div>
          ${l.term ? `<div class="org-term">${escapeHtml(l.term)}</div>` : ''}
        </div>
      </div>`).join('');
    html += '</div>';
  }

  // 各グループ
  (data.departments || []).forEach(dept => {
    html += `<div class="org-group"><div class="org-group-title">🔹 ${escapeHtml(dept.name)}</div>`;
    html += dept.members.map(m => `
      <div class="org-member-card">
        <span class="org-icon">${escapeHtml(m.icon)}</span>
        <div>
          <div class="org-name">${escapeHtml(m.name)}</div>
          <div class="org-role">${escapeHtml(m.role)}</div>
          ${m.term ? `<div class="org-term">${escapeHtml(m.term)}</div>` : ''}
        </div>
      </div>`).join('');
    html += '</div>';
  });

  container.innerHTML = html || '<div class="no-data"><span class="no-data-icon">📋</span>この年度のデータはありません</div>';
}

// ===========================
//  資料ボタン & モーダル
// ===========================
function renderDocumentButtons() {
  const row = document.getElementById('doc-btn-row');
  if (!row) return;
  row.innerHTML = DOCUMENTS.map((d, i) => `
    <button class="doc-btn" onclick="openDocModal(${i})">
      <span class="doc-btn-icon">${d.icon}</span>${d.title}
    </button>`).join('');
}

function openDocModal(index) {
  const d = DOCUMENTS[index];
  showDocModal(d.title, { type: d.type, url: d.url });
}

// 資料モーダルの共通表示処理（DOCUMENTS / Drive資料一覧の両方から使用）
function showDocModal(title, spec) {
  document.getElementById('doc-modal-title').textContent = title;
  const body = document.getElementById('doc-modal-body');
  if (!spec || !spec.url) {
    body.innerHTML = `
      <div class="doc-modal-placeholder">
        <span class="doc-modal-placeholder-icon">📂</span>
        まだファイルが設定されていません<br>
        <small>Google Drive に対象のファイルが<br>見つかりませんでした</small>
      </div>`;
  } else if (spec.type === 'pdf') {
    body.innerHTML = `<iframe src="${spec.url}"></iframe>`;
  } else if (spec.type === 'image') {
    body.innerHTML = `<img src="${spec.url}" alt="${escapeHtml(title)}">`;
  } else {
    body.innerHTML = `
      <div class="doc-modal-placeholder">
        <span class="doc-modal-placeholder-icon">📁</span>
        このファイル形式はアプリ内で<br>プレビューできません
      </div>`;
  }
  document.getElementById('doc-modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDocModal() {
  document.getElementById('doc-modal').classList.remove('open');
  document.body.style.overflow = '';
}

// ===========================
//  LIFF 初期化 & 起動
// ===========================
async function initApp() {
  // LIFF IDが設定されている場合のみ初期化
  if (LIFF_ID && LIFF_ID !== "YOUR_LIFF_ID_HERE") {
    try {
      await liff.init({ liffId: LIFF_ID });
      console.log("LIFF initialized:", liff.getOS());
    } catch (e) {
      console.warn("LIFF初期化エラー（ブラウザ確認中は無視可）:", e.message);
    }
  }

  // URLパラメータ ?tab=notices や ?tab=org でタブを指定可能
  // 例：リッチメニューの「回覧板」ボタンのURLに ?tab=notices を付ける
  const params = new URLSearchParams(location.search);
  const tabParam = params.get('tab');
  if (tabParam) {
    const targetBtn = document.querySelector(`.nav-btn[onclick*="'${tabParam}'"]`);
    if (targetBtn) switchTab(tabParam, targetBtn);
  }

  // お問い合わせタブ（静的データなので即描画）
  renderContacts();

  // Google連携データが届く前の初期表示（「読み込み中...」を表示）
  renderDocumentButtons();
  renderYearFilterChips();
  renderMonthFilterChips();
  renderNoticeList();
  renderDriveFileList();
  renderOrgYearSelector();
  renderOrgChart();

  // ★★★ Googleカレンダー / Drive / スプレッドシートを並行取得 ★★★
  // 3つは互いに独立しており、1つが失敗しても他の表示には影響しません
  await Promise.allSettled([
    fetchCalendarEvents()
      .then(events => {
        calendarEvents = events;
        calendarLoadState = 'ok';
      })
      .catch(e => {
        console.error('カレンダー取得エラー:', e);
        calendarLoadState = 'error';
      }),
    fetchDriveFiles()
      .then(files => {
        driveFiles = files;
        driveLoadState = 'ok';
        resolveDocumentUrls();
      })
      .catch(e => {
        console.error('Drive取得エラー:', e);
        driveLoadState = 'error';
      }),
    fetchOrgSheet()
      .then(rows => {
        orgChartData = buildOrgChartFromRows(rows);
        orgLoadState = 'ok';
      })
      .catch(e => {
        console.error('組織図（スプレッドシート）取得エラー:', e);
        orgLoadState = 'error';
      })
  ]);

  // 取得結果を反映して再描画
  renderDocumentButtons();
  renderYearFilterChips();
  renderMonthFilterChips();
  renderNoticeList();
  renderDriveFileList();
  renderOrgYearSelector();
  renderOrgChart();
}

// アプリ起動（まず合言葉チェックから）
checkAuth();
</script>
